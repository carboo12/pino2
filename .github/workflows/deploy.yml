name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: web

      - name: Build web (Firebase)
        run: npx vite build
        working-directory: web
        env:
          VITE_API_URL: https://rhclaroni.com/api-dev

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          channelId: live
          projectId: pino-5fe44
          entryPoint: web

      - name: Build web (nginx subpath)
        run: npx vite build --base=/dev/prueba/pino/
        working-directory: web
        env:
          VITE_APP_BASENAME: /dev/prueba/pino
          VITE_API_URL: /api-dev

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/apps/pino2
            git pull origin main
            cd backend
            npm run build
            pm2 restart pino-api-dev
            cd ../web
            VITE_APP_BASENAME=/dev/prueba/pino VITE_API_URL=/api-dev npx vite build --base=/dev/prueba/pino/
            rm -rf /var/www/dev/prueba/pino/*
            cp -r dist/* /var/www/dev/prueba/pino/
            echo "✅ Deployed"
