name: CI MVP 10/10

on:
  push:
    branches: [main, stabilization/mvp, hardening/mvp-10]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PG_VERSION: '16'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pino_mvp_test
          POSTGRES_USER: pino_app
          POSTGRES_PASSWORD: pino_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations
        run: node migrations/run_all_migrations.js
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USER: pino_app
          DATABASE_PASSWORD: pino_app_test
          DATABASE_NAME: pino_mvp_test
      - name: Seed
        run: psql -h 127.0.0.1 -U pino_app -d pino_mvp_test -f migrations/seed_test.sql
        env:
          PGPASSWORD: pino_app_test
      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USER: pino_app
          DATABASE_PASSWORD: pino_app_test
          DATABASE_NAME: pino_mvp_test
          TEST_ADMIN_PASSWORD: test1234
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          ! grep -r "TuClaveFuerte\|cambiame\|secreto_super_seguro\|Password123!" \
            --include='*.ts' --include='*.js' --include='*.tsx' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=.git . | \
            grep -v "__DB_PASSWORD_PLACEHOLDER__\|__JWT_SECRET_PLACEHOLDER__\|__DB_HOST_PLACEHOLDER__" \
            | grep . ; test $? -eq 1
      - name: Check .env files
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "ERROR: .env files are tracked!"; exit 1;
          fi
      - name: Check for hardcoded credentials in tests
        run: |
          if grep -r "process\.env\." backend/test/ --include='*.ts' | grep -q -v "|| process.env"; then
            echo "OK: tests use env vars"
          fi
