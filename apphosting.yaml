# Configuración de Firebase App Hosting
runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

headers:
  - source: /**
    headers:
      - key: Content-Security-Policy
        value: "connect-src 'self' https://*.firebase.googleapis.com https://*.googleapis.com https://*.google-analytics.com https://*.google.com wss: ws: https: http:;"
